[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cavsqueeze"
version = "1.6.0"
description = "Beyond-mean-field cavity-mediated spin squeezing for solid-state clock-transition ensembles"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
exact = ["qutip>=5.0"]
test = ["pytest", "qutip>=5.0"]

[tool.setuptools]
packages = ["cavsqueeze"]
